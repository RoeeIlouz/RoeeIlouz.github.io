name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Least privilege by default; jobs opt in to what they need.
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro Site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        # Fails on any high or critical advisory except the IDs in AUDIT_ALLOW (see .github/audit-check.mjs).
        # GHSA-ch52-4w7c-c8xp: http-cache-semantics <= 4.2.0, pulled in by astro. No patched release yet,
        # and it only runs at build time for this static site. Remove it once a fix ships.
        env:
          AUDIT_ALLOW: GHSA-ch52-4w7c-c8xp
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          node .github/audit-check.mjs "$RUNNER_TEMP/audit.json"

      - name: Build site
        run: npm run build
        env:
          # Read-only token so build-time GitHub API calls aren't rate limited.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
          # Needed to publish /.well-known/security.txt
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
