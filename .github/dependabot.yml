version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      fonts-and-icons:
        patterns: ["@fontsource-variable/*", "@fortawesome/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
